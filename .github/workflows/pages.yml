# Builds the game and publishes it to GitHub Pages (DESIGN.md §20 "Hosting", R-HOST-1, ADR-0015).
# Pages serves a project site under /<repo>/, so the build takes its base path from configure-pages.
# vite.config.ts keeps '/', which the dev server, preview and the e2e suite rely on.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying finishes rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run typecheck
      # The atlases are committed (ADR-0006), so the build needs no Chromium.
      # base_path is "/<repo>" for a project site, and "" for a user site or a custom domain.
      - run: npx vite build --base="$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
